# CI: build + unit tests + lint on both sides.
# Note: authored before the repo's first push — if a job fails on the first
# run, it is most likely runner-environment drift (SDK licenses, Xcode
# version), not product code.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build, test, lint
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest lint ktfmtCheck

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: macos
        run: swift build
      - name: Test
        working-directory: macos
        run: ./scripts/test.sh
      - name: Assemble app bundle
        working-directory: macos
        run: ./scripts/build-app.sh
